services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cmms-api:latest
    container_name: cmms-api
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    networks:
      - cmms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/swagger/index.html >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: cmms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cmms-net
    depends_on:
      - api

networks:
  cmms-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
