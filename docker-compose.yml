services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cmms-api:latest
    container_name: cmms-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/swagger/index.html >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
